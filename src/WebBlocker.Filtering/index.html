<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>网页访问已拦截 | WebBlocker</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      color: #17233c;
      background: #f3f6fa;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body {
      min-width: 280px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
    }
    main {
      width: min(100%, 680px);
      padding: clamp(30px, 7vw, 64px);
      border: 1px solid #dfe6ef;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 16px 48px rgba(27, 44, 71, .08);
    }
    .eyebrow {
      margin: 0 0 18px;
      color: #52647e;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      color: #9c2f35;
      font-size: clamp(24px, 5vw, 34px);
      line-height: 1.5;
      font-weight: 650;
    }
    .translation {
      margin: 16px 0 0;
      color: #44536b;
      font-size: 16px;
      line-height: 1.7;
    }
    .divider { height: 1px; margin: 30px 0 22px; background: #e7ecf2; }
    .notice { margin: 0; color: #6a778b; font-size: 13px; line-height: 1.7; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">WebBlocker · Access control</p>
    <h1>此网页已被管理员设置为禁止访问</h1>
    <p class="translation">This webpage has been blocked by the administrator.</p>
    <div class="divider" aria-hidden="true"></div>
    <p class="notice">如需访问此网站，请联系设备管理员。<br>To request access, contact your device administrator.</p>
  </main>
</body>
</html>
